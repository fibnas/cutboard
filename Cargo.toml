[package]
name = "cutboard"
version = "0.1.0"
edition = "2021"
description = "TUI paper-edit board for mini-documentaries: project → scenes → dialogue text files"
license = "MIT"
repository = "https://github.com/fibnas/cutboard"
homepage = "https://github.com/fibnas/cutboard"
readme = "README.md"

[dependencies]
anyhow = "=1.0.86"
crossterm = "=0.27.0"
ratatui = { version = "=0.26.3", default-features = false, features = ["crossterm"] }
unicode-width = "=0.1.13"
unicode-segmentation = "=1.11.0"
